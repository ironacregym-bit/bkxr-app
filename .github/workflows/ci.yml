name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sitebuilder-and-marketing:
    name: SiteBuilder and marketing website
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository-pinned npm version
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test SiteBuilder
        run: npm run test --workspace=@pt/site-builder

      - name: Type-check SiteBuilder
        run: npm run typecheck --workspace=@pt/site-builder

      - name: Build SiteBuilder
        run: npm run build --workspace=@pt/site-builder

      - name: Build Iron Acre public website
        run: npm run build --workspace=@pt/iron-acre-web
